; ---------------------------------------------------------------------------
; One build environment per node. Each sets that node's ID and Wi-Fi name, so
; the source code never has to be edited before flashing.
;
; HOW TO FLASH A BOARD
;   VS Code: click the "env:..." selector in the blue status bar, pick the node
;   (e.g. env:node3), then click Upload (->). Or in the PlatformIO sidebar:
;   Project Tasks > node3 > Upload.
;   Terminal: pio run -e node3 -t upload --upload-port COM5
; Then label the board with its node number.
;
; EXPERIMENT BUILDS (Section 4.2.1): <config>-n<node>, e.g.
;   pio run -e baseline-n3 -t upload
; flashes V3 with the Baseline configuration. All six boards must run the SAME
; configuration during a run. "full" needs include/cart_model.h (tools/train_cart.py).
;
; V1 = Main Hub (barangay hall), V2-V5 = Mini Hubs, V6 = Distant Edge Node.
; ---------------------------------------------------------------------------

[platformio]
; Safety: the plain Upload button only ever flashes this env. Switch env first.
default_envs = node1

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; Type a whole command (e.g. "routes"), see it as you type, send it with Enter.
monitor_filters = send_on_enter
monitor_echo = yes
; CDC_ON_BOOT=0: serial goes through the Heltec V3's USB-serial chip (the COM
; port). With =1 it would go to the ESP32's native USB pins and the monitor stays blank.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.1.2
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.1.5
    https://github.com/mathieucarbou/AsyncTCP.git


; ---- Node identity (used by every environment below) ----
[node1]
flags = -D NODE_ID_CFG=1 -D AP_SSID_CFG=\"EMERGENCY-HUB-01\"

[node2]
flags = -D NODE_ID_CFG=2 -D AP_SSID_CFG=\"EMERGENCY-HUB-02\"

[node3]
flags = -D NODE_ID_CFG=3 -D AP_SSID_CFG=\"EMERGENCY-HUB-03\"

[node4]
flags = -D NODE_ID_CFG=4 -D AP_SSID_CFG=\"EMERGENCY-HUB-04\"

[node5]
flags = -D NODE_ID_CFG=5 -D AP_SSID_CFG=\"EMERGENCY-HUB-05\"

[node6]
flags = -D NODE_ID_CFG=6 -D AP_SSID_CFG=\"EMERGENCY-HUB-06\"

; ---- Configurations (Section 4.2.1, Table 4.1) ----
; Config 1 Baseline: FIFO queue, no relay filter, drop on link failure
[cfg_baseline]
flags = -D QUEUE_MODE_CFG=QUEUE_FIFO -D DTN_ENABLED_CFG=0 -D RELAY_FILTER_CFG=RELAY_FILTER_NONE -D CONFIG_NAME_CFG=\"baseline\"

; Config 2 Partial: min-heap, no relay filter, drop on link failure
[cfg_partial]
flags = -D QUEUE_MODE_CFG=QUEUE_HEAP -D DTN_ENABLED_CFG=0 -D RELAY_FILTER_CFG=RELAY_FILTER_NONE -D CONFIG_NAME_CFG=\"partial\"

; Config 3 Heuristic: min-heap, static rule filter, drop on link failure
[cfg_heuristic]
flags = -D QUEUE_MODE_CFG=QUEUE_HEAP -D DTN_ENABLED_CFG=0 -D RELAY_FILTER_CFG=RELAY_FILTER_HEURISTIC -D CONFIG_NAME_CFG=\"heuristic\"

; Config 4 Ablation: min-heap, static rule filter, DTN store-and-forward
[cfg_ablation]
flags = -D QUEUE_MODE_CFG=QUEUE_HEAP -D DTN_ENABLED_CFG=1 -D RELAY_FILTER_CFG=RELAY_FILTER_HEURISTIC -D CONFIG_NAME_CFG=\"ablation\"

; Config 5 Full: min-heap, CART classifier, DTN store-and-forward
[cfg_full]
flags = -D QUEUE_MODE_CFG=QUEUE_HEAP -D DTN_ENABLED_CFG=1 -D RELAY_FILTER_CFG=RELAY_FILTER_CART -D CONFIG_NAME_CFG=\"full\"

; ---- Development / field-test builds: min-heap + DTN, no filter (CART in shadow
; mode if include/cart_model.h exists). Used for Tests A-F. ----
[env:node1]
build_flags = ${env.build_flags} ${node1.flags}

[env:node2]
build_flags = ${env.build_flags} ${node2.flags}

[env:node3]
build_flags = ${env.build_flags} ${node3.flags}

[env:node4]
build_flags = ${env.build_flags} ${node4.flags}

[env:node5]
build_flags = ${env.build_flags} ${node5.flags}

[env:node6]
build_flags = ${env.build_flags} ${node6.flags}

; ---- Config 1 Baseline: FIFO queue, no relay filter, drop on link failure ----
[env:baseline-n1]
build_flags = ${env.build_flags} ${node1.flags} ${cfg_baseline.flags}

[env:baseline-n2]
build_flags = ${env.build_flags} ${node2.flags} ${cfg_baseline.flags}

[env:baseline-n3]
build_flags = ${env.build_flags} ${node3.flags} ${cfg_baseline.flags}

[env:baseline-n4]
build_flags = ${env.build_flags} ${node4.flags} ${cfg_baseline.flags}

[env:baseline-n5]
build_flags = ${env.build_flags} ${node5.flags} ${cfg_baseline.flags}

[env:baseline-n6]
build_flags = ${env.build_flags} ${node6.flags} ${cfg_baseline.flags}

; ---- Config 2 Partial: min-heap, no relay filter, drop on link failure ----
[env:partial-n1]
build_flags = ${env.build_flags} ${node1.flags} ${cfg_partial.flags}

[env:partial-n2]
build_flags = ${env.build_flags} ${node2.flags} ${cfg_partial.flags}

[env:partial-n3]
build_flags = ${env.build_flags} ${node3.flags} ${cfg_partial.flags}

[env:partial-n4]
build_flags = ${env.build_flags} ${node4.flags} ${cfg_partial.flags}

[env:partial-n5]
build_flags = ${env.build_flags} ${node5.flags} ${cfg_partial.flags}

[env:partial-n6]
build_flags = ${env.build_flags} ${node6.flags} ${cfg_partial.flags}

; ---- Config 3 Heuristic: min-heap, static rule filter, drop on link failure ----
[env:heuristic-n1]
build_flags = ${env.build_flags} ${node1.flags} ${cfg_heuristic.flags}

[env:heuristic-n2]
build_flags = ${env.build_flags} ${node2.flags} ${cfg_heuristic.flags}

[env:heuristic-n3]
build_flags = ${env.build_flags} ${node3.flags} ${cfg_heuristic.flags}

[env:heuristic-n4]
build_flags = ${env.build_flags} ${node4.flags} ${cfg_heuristic.flags}

[env:heuristic-n5]
build_flags = ${env.build_flags} ${node5.flags} ${cfg_heuristic.flags}

[env:heuristic-n6]
build_flags = ${env.build_flags} ${node6.flags} ${cfg_heuristic.flags}

; ---- Config 4 Ablation: min-heap, static rule filter, DTN store-and-forward ----
[env:ablation-n1]
build_flags = ${env.build_flags} ${node1.flags} ${cfg_ablation.flags}

[env:ablation-n2]
build_flags = ${env.build_flags} ${node2.flags} ${cfg_ablation.flags}

[env:ablation-n3]
build_flags = ${env.build_flags} ${node3.flags} ${cfg_ablation.flags}

[env:ablation-n4]
build_flags = ${env.build_flags} ${node4.flags} ${cfg_ablation.flags}

[env:ablation-n5]
build_flags = ${env.build_flags} ${node5.flags} ${cfg_ablation.flags}

[env:ablation-n6]
build_flags = ${env.build_flags} ${node6.flags} ${cfg_ablation.flags}

; ---- Config 5 Full: min-heap, CART classifier, DTN store-and-forward ----
[env:full-n1]
build_flags = ${env.build_flags} ${node1.flags} ${cfg_full.flags}

[env:full-n2]
build_flags = ${env.build_flags} ${node2.flags} ${cfg_full.flags}

[env:full-n3]
build_flags = ${env.build_flags} ${node3.flags} ${cfg_full.flags}

[env:full-n4]
build_flags = ${env.build_flags} ${node4.flags} ${cfg_full.flags}

[env:full-n5]
build_flags = ${env.build_flags} ${node5.flags} ${cfg_full.flags}

[env:full-n6]
build_flags = ${env.build_flags} ${node6.flags} ${cfg_full.flags}
